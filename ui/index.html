<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>token-fire</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="ornament" title="拖动摆放位置 · 右键打开设置">
    <div id="glow"></div>
    <svg id="scene" shape-rendering="crispEdges" aria-label="像素篝火">
      <g id="static"></g>
      <g class="frame" data-frame="0"></g>
      <g class="frame" data-frame="1"></g>
      <g class="frame" data-frame="2"></g>
      <g class="frame" data-frame="3"></g>
      <g id="sparks" class="sparks"></g>
      <rect class="flame-hit" x="0" y="0" width="0" height="0"></rect>
    </svg>
    <div id="base"></div>
    <div id="alert" hidden></div>
    <div id="readout"><b id="rate">--</b></div>
    <div id="hint" hidden title="按今天（缺数据时用本周）各时段的真实花费与 token 折算剩余 token"></div>
  </div>
  <script type="module" src="widget.js"></script>
</body>
</html>
